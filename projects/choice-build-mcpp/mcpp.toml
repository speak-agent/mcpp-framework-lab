# The build program names the host's cmake, so the xim:cmake payload is not requested.
[package]
name        = "lab-choice-build-mcpp"
version     = "0.1.0"
description = "Lab case: choice-build-mcpp"
license     = "Apache-2.0"
authors     = ["speak-agent"]

[language]
standard   = "c++23"
modules    = true
import_std = true

# The placeholder below is the plugins checkout; scripts/lab.sh replaces it when it
# copies the projects into the working tree.
[build-dependencies.mcpp]
plugins = { path = "@PLUGINS@", features = ["deps-cmake"], host-module = true }

[targets.lab-choice-build-mcpp]
kind = "bin"
main = "src/main.cpp"
