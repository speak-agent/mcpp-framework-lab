# The same tool stated by [xlings.overrides] in the root manifest.
[package]
name        = "lab-override-manifest"
version     = "0.1.0"
description = "Lab case: override-manifest"
license     = "Apache-2.0"
authors     = ["speak-agent"]

[language]
standard   = "c++23"
modules    = true
import_std = true

# The placeholder below is the plugins checkout; scripts/lab.sh replaces it when it
# copies the projects into the working tree.
[build-dependencies.mcpp]
plugins = { path = "@PLUGINS@", features = ["deps-cmake"], host-module = true }

[targets.lab-override-manifest]
kind = "bin"
main = "src/main.cpp"

# The project's own statement of where the payload comes from: the host's cmake,
# which scripts/lab.sh finds and writes in place of the placeholder.
[xlings.overrides]
"xim:cmake" = "@CMAKE@"
